global:
  namespace: workflow-hello-world

service:
  type: NodePort
  port: 389
  targetPort: 389
  nodePort: 30389

ldap:
  baseDN: "dc=example,dc=ch"
  adminUsername: "cn=admin,dc=example,dc=ch"
  adminPassword: "password"

openldapImage:
  repository: vegardit/openldap
  tag: "2.6.10"
  pullPolicy: IfNotPresent

ldapUi:
  enabled: true
  image:
    repository: dnknth/ldap-ui
    tag: "0.15.3"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 5000
    targetPort: 5000
    nodePort: 30500
  # %s = login with the full bind DN (e.g. cn=admin,dc=example,dc=ch)
  bindPattern: "%s"

alpineImage:
  repository: alpine
  tag: "3.24"
  pullPolicy: IfNotPresent