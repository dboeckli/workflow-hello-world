apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workflow-hello-world-ldap-chart.fullname" . }}-config-map
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "workflow-hello-world-ldap-chart.labels" . | nindent 4 }}
data:
  init_org_tree.ldif: |
    version: 1

    ##############################
    # LDAP tree definition
    ##############################
    dn: ${LDAP_INIT_ORG_DN}
    dc: example
    objectClass: top
    objectClass: dcObject
    objectClass: organization
    o: Example, Inc

    dn: ou=groups,${LDAP_INIT_ORG_DN}
    objectClass: top
    objectClass: organizationalUnit
    ou: groups

    dn: ou=users,${LDAP_INIT_ORG_DN}
    objectClass: top
    objectClass: organizationalUnit
    ou: users

  init_org_entries.ldif: |
    version: 1

    # groups
    dn: cn=camunda-admins,ou=groups,${LDAP_INIT_ORG_DN}
    objectClass: groupOfNames
    cn: camunda-admins
    member: cn=camunda-admin,ou=users,${LDAP_INIT_ORG_DN}

    # group: readers
    dn: cn=readers,ou=groups,${LDAP_INIT_ORG_DN}
    objectClass: groupOfNames
    cn: readers
    member: cn=user01,ou=users,${LDAP_INIT_ORG_DN}

    # group: editors
    dn: cn=editors,ou=groups,${LDAP_INIT_ORG_DN}
    objectClass: groupOfNames
    cn: editors
    member: cn=user02,ou=users,${LDAP_INIT_ORG_DN}

    # camunda admin
    dn: cn=camunda-admin,ou=users,${LDAP_INIT_ORG_DN}
    objectClass: inetOrgPerson
    cn: camunda-admin
    uid: camunda-admin
    givenName: Admin
    sn: Admin User
    userPassword: camunda-admin-password
    mail: camunda-admin@example.ch

    # user01
    dn: cn=user01,ou=users,${LDAP_INIT_ORG_DN}
    objectClass: inetOrgPerson
    cn: user01
    uid: user01
    givenName: John
    sn: Doe
    userPassword: user01-password
    mail: john.doe@example.com

    # user02
    dn: cn=user02,ou=users,${LDAP_INIT_ORG_DN}
    objectClass: inetOrgPerson
    cn: user02
    uid: user02
    givenName: Jane
    sn: Smith
    userPassword: user02-password
    mail: jane.smith@example.com

    # user03
    dn: cn=user03,ou=users,${LDAP_INIT_ORG_DN}
    objectClass: inetOrgPerson
    cn: user03
    uid: user03
    givenName: Bob
    sn: Johnson
    userPassword: user03-password
    mail: user03@example.ch

  init_mdb_acls.ldif: |
    version: 1

    # General Database Options @ https://linux.die.net/man/5/slapd-config
    #
    # Dev-only override of the vegardit default ACLs: the last rule grants
    # anonymous read access so the LDAP browser (dnknth/ldap-ui) can probe and
    # browse the directory without binding. userPassword stays restricted to
    # "by anonymous auth" (rule 2), so credentials are still required to read it.

    dn: olcDatabase={1}mdb,cn=config
    changetype: modify
    ########################
    # configure ACLs
    ########################
    replace: olcAccess
    # The frontend ACL determines effective Root DSE visibility before slapd reaches
    # this backend. Keep this rule first because provider bootstrap inserts its
    # replication access rule at {1}, ahead of the attribute restrictions below.
    olcAccess: {0}to dn.base=""
      by * read
    olcAccess: {1}to attrs=shadowLastChange
      by self write
      by users read
      by * none
    olcAccess: {2}to attrs=userPassword
      by dn="${LDAP_INIT_ROOT_USER_DN}" write
      by group/groupOfUniqueNames/uniqueMember="${LDAP_INIT_ADMIN_GROUP_DN}" write
      by group/groupOfUniqueNames/uniqueMember="${LDAP_INIT_PASSWORD_RESET_GROUP_DN}" write
      by self write
      by anonymous auth
      by * none
    olcAccess: {3}to attrs=sshPublicKey
      by dn="${LDAP_INIT_ROOT_USER_DN}" write
      by group/groupOfUniqueNames/uniqueMember="${LDAP_INIT_ADMIN_GROUP_DN}" write
      by group/groupOfUniqueNames/uniqueMember="${LDAP_INIT_PASSWORD_RESET_GROUP_DN}" write
      by self write
      by users read
      by * none
    olcAccess: {4}to *
      by dn="${LDAP_INIT_ROOT_USER_DN}" write
      by group/groupOfUniqueNames/uniqueMember="${LDAP_INIT_ADMIN_GROUP_DN}" write
      by users read
      by anonymous read
      by * none
